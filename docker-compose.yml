# Local development:   docker compose up -d mysql redis   (then npm run dev)
# Full stack:          docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies pending migrations once, then exits.
  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    env_file:
      - path: .env
        required: false
    # Container hostnames; everything else comes from .env.
    environment: &container-env
      DATABASE_URL: mysql://app:app@mysql:3306/app
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *container-env
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment: *container-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  uploads:
